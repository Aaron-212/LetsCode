[project]
name = "letscode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.3",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "langchain>=1.3.1",
    "langchain-openai>=1.2.2",
    "platformdirs>=4.9.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "textual>=8.2.7",
]

[project.scripts]
letscode = "letscode.main:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
